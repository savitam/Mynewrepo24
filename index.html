<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Joke Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; max-width: 700px; margin: 4rem auto; padding: 0 1rem; color:#111 }
    h1 { font-size:1.6rem; margin-bottom: .5rem }
    #joke { margin: 1.5rem 0; padding: 1rem; background:#f6f6f9; border-radius:8px; min-height:3rem }
    button { padding: .6rem 1rem; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer }
    button:disabled { opacity: .6; cursor: not-allowed }
  </style>
</head>
<body>
  <h1>Random Joke Generator</h1>
  <p>Fetches a random joke from an external API (icanhazdadjoke).</p>
  <div id="joke">Click "Get Joke" to start</div>
  <button id="getJoke">Get Joke</button>

  <script src="script.js"></script>
</body>
</html>
